[project]
name = "blog-contents"
version = "0.1.0"
dependencies = [
    "google-cloud-storage>=2.19.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.9.3",
    "types-pyyaml>=6.0.12.20241230",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ['google.cloud']
ignore_missing_imports = true

