name: Update Page Info

on:
  push:
    branches:
      - main
    paths:
      - '**.md'

jobs:
  update-page-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml pydantic

      - name: Run update_page_info.py
        run: |
          python update_page_info.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add page-info.json
            git commit -m "Update page-info.json"
            git push
          else
            echo "No changes to commit"
          fi
